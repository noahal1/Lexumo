<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d231f" media="(prefers-color-scheme: dark)" />
    <title>Lexumo 词砚</title>
    <meta
      name="description"
      content="Lexumo 词砚，本地优先的间隔重复词汇学习桌面应用"
    />
    <link rel="icon" href="/icon.svg" />
    <style>
      /* Paint the right canvas and a matching skeleton before the bundle
         loads, so the first frame is never a blank white rectangle. These
         literals mirror tokens.css by hand: the token sheet has not loaded
         yet at this point, so there is nothing to reference. */
      :root {
        --b-bg: #f9f7f3;
        --b-surface: #fefdfa;
        --b-line: #e0ded7;
        --b-skel: #eeece5;
        --b-frame: #252c28;
        --b-frame-2: #1c221f;
        --b-frame-line: #3f4743;
        --b-frame-ink: #e7ebe7;
        --b-accent: #175b72;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --b-bg: #1d231f;
          --b-surface: #262c27;
          --b-line: #2f3633;
          --b-skel: #2d342e;
          --b-frame: #050706;
          --b-frame-2: #030504;
          --b-frame-line: #39443e;
          --b-frame-ink: #dddfda;
          --b-accent: #66adc5;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--b-bg);
        overflow: clip;
      }
      #root {
        height: 100%;
      }
      .boot {
        display: flex;
        flex-direction: column;
        height: 100%;
        font-family: "IBM Plex Sans", "Segoe UI", "PingFang SC", "Microsoft YaHei",
          system-ui, sans-serif;
      }
      /* The title bar only exists in the desktop shell, so the skeleton only
         draws it there — otherwise a browser tab would flash a strip that the
         app then removes. */
      .boot-bar {
        display: none;
        align-items: center;
        gap: 8px;
        height: 36px;
        /* 20px, not 12: the real bar puts the seal on the nav icons' axis, and
           the skeleton must not jump 8px sideways when the app takes over.
           The window opens at 1200px, which is the full-sidebar layout. */
        padding-left: 20px;
        box-sizing: border-box;
        background: var(--b-frame);
        border-bottom: 1px solid var(--b-frame-line);
      }
      html.is-desktop .boot-bar {
        display: flex;
      }
      .boot-barmark {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        border-radius: 2px;
        background: var(--b-frame-line);
      }
      .boot-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .boot-side {
        width: 232px;
        flex: 0 0 232px;
        border-right: 1px solid var(--b-frame-line);
        background: var(--b-frame);
        padding: 20px 12px;
        box-sizing: border-box;
      }
      .boot-nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
      }
      .boot-main {
        flex: 1;
        padding: 20px 32px;
        box-sizing: border-box;
      }
      .boot-head {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-bottom: 26px;
        padding-top: 6px;
      }
      .boot-card {
        border: 1px solid var(--b-line);
        border-radius: 6px;
        background: var(--b-surface);
        padding: 8px 0;
        overflow: hidden;
      }
      .boot-row {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 13px 20px;
        border-bottom: 1px solid var(--b-line);
      }
      .boot-row:last-child {
        border-bottom: 0;
      }
      .sk {
        display: block;
        height: 11px;
        border-radius: 2px;
        background: var(--b-skel);
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      .sk.h1 {
        height: 20px;
        width: 150px;
      }
      .sk.h2 {
        height: 10px;
        width: 220px;
      }
      .sk.nav {
        height: 36px;
        width: 100%;
      }
      .sk.term {
        height: 14px;
        width: 34%;
      }
      .sk.def {
        height: 11px;
        width: 46%;
      }
      .sk.pill {
        height: 20px;
        width: 62px;
        border-radius: 3px;
        margin-left: auto;
      }
      .sk.tname {
        width: 64px;
        height: 10px;
        background: var(--b-frame-line);
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
      }
    </style>
    <script>
      // The window title bar exists only inside the desktop shell. Deciding it
      // before first paint keeps the skeleton from shifting when the bundle
      // takes over. Tauri's init script runs before this one, so the check
      // holds; in a browser tab the class is simply never added.
      //
      // Mobile is a Tauri shell too (same global) but it has no window chrome:
      // the system draws the status bar. So it gets neither the is-desktop class
      // nor the skeleton stripe that the app would then have to remove. The UA
      // is tested inline because this runs before the bundle and must not
      // depend on it.
      if (
        "__TAURI_INTERNALS__" in window &&
        !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      ) {
        document.documentElement.className = "is-desktop";
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-bar">
          <span class="boot-barmark"></span>
          <span class="sk tname"></span>
        </div>
        <div class="boot-body">
          <div class="boot-side">
            <div class="boot-nav">
              <span class="sk nav"></span>
              <span class="sk nav"></span>
              <span class="sk nav"></span>
              <span class="sk nav"></span>
              <span class="sk nav"></span>
            </div>
          </div>
          <div class="boot-main">
            <div class="boot-head">
              <span class="sk h1"></span>
              <span class="sk h2"></span>
            </div>
            <div class="boot-card">
              <div class="boot-row">
                <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
              </div>
              <div class="boot-row">
                <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
              </div>
              <div class="boot-row">
                <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
              </div>
              <div class="boot-row">
                <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
              </div>
              <div class="boot-row">
                <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
