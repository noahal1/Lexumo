<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
    <title>Lexumo 词砚</title>
    <meta
      name="description"
      content="Lexumo 词砚，本地优先的间隔重复词汇学习桌面应用"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='4' fill='%23175b72'/%3E%3Ctext x='32' y='47' font-family='Songti SC,SimSun,serif' font-size='40' font-weight='600' fill='%23f9fcfe' text-anchor='middle'%3E%E8%AF%8D%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* Paint the right canvas and a matching skeleton before the bundle
         loads, so the first frame is never a blank white rectangle. These
         literals mirror tokens.css by hand: the token sheet has not loaded
         yet at this point, so there is nothing to reference. */
      :root {
        --b-bg: #f9f7f3;
        --b-surface: #fefdfa;
        --b-line: #e0ded7;
        --b-skel: #eeece5;
        --b-frame: #252c28;
        --b-frame-2: #1c221f;
        --b-frame-line: #3f4743;
        --b-frame-ink: #e7ebe7;
        --b-accent: #175b72;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --b-bg: #121614;
          --b-surface: #1c201e;
          --b-line: #2f3633;
          --b-skel: #232826;
          --b-frame: #070b09;
          --b-frame-2: #040605;
          --b-frame-line: #1f2623;
          --b-frame-ink: #dddfda;
          --b-accent: #70c8cd;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--b-bg);
        overflow: clip;
      }
      #root {
        height: 100%;
      }
      .boot {
        display: flex;
        height: 100%;
        font-family: "IBM Plex Sans", "Segoe UI", "PingFang SC", "Microsoft YaHei",
          system-ui, sans-serif;
      }
      .boot-side {
        width: 232px;
        flex: 0 0 232px;
        border-right: 1px solid var(--b-frame-line);
        background: var(--b-frame);
        padding: 20px 12px;
        box-sizing: border-box;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 8px 22px;
      }
      .boot-mark {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        border-radius: 2px;
        background: var(--b-accent);
        color: #f9fcfe;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Serif", "Songti SC", SimSun, serif;
        font-size: 19px;
        font-weight: 600;
        line-height: 1;
      }
      .boot-brandtext {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .boot-nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
      }
      .boot-main {
        flex: 1;
        padding: 20px 32px;
        box-sizing: border-box;
      }
      .boot-head {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-bottom: 26px;
        padding-top: 6px;
      }
      .boot-card {
        border: 1px solid var(--b-line);
        border-radius: 6px;
        background: var(--b-surface);
        padding: 8px 0;
        overflow: hidden;
      }
      .boot-row {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 13px 20px;
        border-bottom: 1px solid var(--b-line);
      }
      .boot-row:last-child {
        border-bottom: 0;
      }
      .sk {
        display: block;
        height: 11px;
        border-radius: 2px;
        background: var(--b-skel);
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      .sk.h1 {
        height: 20px;
        width: 150px;
      }
      .sk.h2 {
        height: 10px;
        width: 220px;
      }
      .sk.nav {
        height: 36px;
        width: 100%;
      }
      .sk.term {
        height: 14px;
        width: 34%;
      }
      .sk.def {
        height: 11px;
        width: 46%;
      }
      .sk.pill {
        height: 20px;
        width: 62px;
        border-radius: 3px;
        margin-left: auto;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-side">
          <div class="boot-brand">
            <div class="boot-mark">词</div>
            <div class="boot-brandtext">
              <span class="sk" style="width: 74px"></span>
              <span class="sk" style="width: 40px"></span>
            </div>
          </div>
          <div class="boot-nav">
            <span class="sk nav"></span>
            <span class="sk nav"></span>
            <span class="sk nav"></span>
            <span class="sk nav"></span>
            <span class="sk nav"></span>
          </div>
        </div>
        <div class="boot-main">
          <div class="boot-head">
            <span class="sk h1"></span>
            <span class="sk h2"></span>
          </div>
          <div class="boot-card">
            <div class="boot-row">
              <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
            </div>
            <div class="boot-row">
              <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
            </div>
            <div class="boot-row">
              <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
            </div>
            <div class="boot-row">
              <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
            </div>
            <div class="boot-row">
              <span class="sk term"></span><span class="sk def"></span><span class="sk pill"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
