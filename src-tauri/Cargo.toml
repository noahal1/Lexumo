[package]
name = "lexilo"
version = "0.1.0"
description = "Lexilo · 词屿 — a calm desktop vocabulary studio"
authors = ["Lexilo contributors"]
edition = "2021"
rust-version = "1.77.2"

# The library is what the desktop binary links against. Keeping the app logic
# in a lib crate is the Tauri 2 convention and leaves room for a mobile target.
[lib]
name = "lexilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
